name: FileForge

options:
  bundleIdPrefix: com.fileforge
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  FileForge:
    type: application
    platform: macOS
    sources:
      - path: FileForge
    entitlements:
      path: FileForge/FileForge.entitlements
      properties:
        # NOT sandboxed: the app shells out to LibreOffice for Office formats
        # and reads/writes wherever the user drops files. Sandboxing would need
        # security-scoped bookmarks for every output location and would block
        # spawning the converter entirely.
        com.apple.security.app-sandbox: false
    info:
      path: FileForge/Info.plist
      properties:
        CFBundleName: FileForge
        CFBundleDisplayName: FileForge
        CFBundleIdentifier: com.fileforge.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Ibrahim Sultan"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.fileforge.app
        # Stable Apple Development identity rather than ad-hoc: ad-hoc
        # signatures change every rebuild, which makes macOS re-prompt for
        # file-access grants each time.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "FCA42E323914AB830BBA766A39230C35D2878E0F"
        PROVISIONING_PROFILE_SPECIFIER: ""
